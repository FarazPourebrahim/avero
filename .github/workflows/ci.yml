name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format-check

      - name: Build packages
        run: pnpm run packages-build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Size budgets
        run: pnpm run size

      - name: Build Storybook
        run: pnpm run storybook-build

      - name: Install Playwright browsers
        run: pnpm --filter @avero/storybook-app exec playwright install --with-deps chromium

      - name: Docs page template
        run: pnpm --filter @avero/docs run check-sections

      - name: Docs props coverage
        run: pnpm --filter @avero/docs run check-props

      - name: Docs internal links
        run: pnpm --filter @avero/docs run check-links

      - name: Build docs
        run: pnpm run docs-build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/storybook/playwright-report
          retention-days: 14
